name: iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Build unsigned Release
        working-directory: apps/ios/Orange Cloud
        run: |
          xcodebuild \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Upload build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orange-cloud-ios
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: warn
